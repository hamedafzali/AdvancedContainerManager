services:
  # Frontend service
  frontend:
    build:
      context: .
      target: frontend-builder
    container_name: advanced-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app/frontend
    command:
      ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      - NODE_ENV=production

  advanced-container-manager:
    build: .
    container_name: advanced-container-manager
    restart: unless-stopped
    user: "0:0"
    ports:
      - "5003:5003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=5003
      - HOST=0.0.0.0
      - DEBUG=true
      - CORS_ORIGIN=http://localhost:3000,http://host:3000
      - SOCKET_ORIGIN=http://localhost:3000,http://host:3000
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PROJECTS_DIR=/data/projects
      - DATABASE_PATH=/data/db/manager.sqlite
      - LEGACY_PROJECTS_DIR=/tmp/advanced_manager_projects
      - LEGACY_CONFIG_PATH=/tmp/advanced_manager_config.json
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - WEBSOCKET_TIMEOUT=300000
      - TERMINAL_TIMEOUT=3600000
      - MAX_TERMINAL_SESSIONS=100
      - METRICS_INTERVAL=5000
      - METRICS_RETENTION=24
      # Cloudflare named tunnels — can also be set at runtime in Settings
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - TUNNEL_ORIGIN_HOST=${TUNNEL_ORIGIN_HOST:-host.docker.internal}
    volumes:
      - ./data/projects:/data/projects
      - ./data/db:/data/db
      - /tmp/advanced_manager_projects:/tmp/advanced_manager_projects
      - /tmp/advanced_manager_config.json:/tmp/advanced_manager_config.json
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cloudflare tunnel connectors — independent of ACM on purpose.
  # ACM previously spawned these as child processes of its own container and
  # stored the connector tokens at a path outside any bind mount, so every
  # ACM rebuild killed all three sites with no auto-recovery (2026-08-09
  # outage). Running them as their own compose services with
  # restart: unless-stopped means an ACM rebuild/restart no longer touches
  # them. extra_hosts is required on Linux for host.docker.internal to
  # resolve inside the container (unlike Docker Desktop).
  koodakbook-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: koodakbook-tunnel
    restart: unless-stopped
    command: tunnel run --token ${KOODAKBOOK_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  trainova-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: trainova-tunnel
    restart: unless-stopped
    command: tunnel run --token ${TRAINOVA_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  afzali-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: afzali-tunnel
    restart: unless-stopped
    command: tunnel run --token ${AFZALI_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: Redis for metrics storage
  redis:
    image: redis:7-alpine
    container_name: advanced-manager-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge

volumes:
  redis_data:
    driver: local
  projects_data:
    driver: local
  config_data:
    driver: local
  logs_data:
    driver: local
